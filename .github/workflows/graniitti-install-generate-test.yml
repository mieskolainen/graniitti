# GitHub Actions continuous integration

name: graniitti-install-generate-test

on: [push]

jobs:
  graniitti-install-generate-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el -o pipefail {0}
    env:
      CONDA_CXX_ABI: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: graniitti

      - name: Install Python tools
        run: |
          conda activate graniitti
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --no-build-isolation hebo

      - name: Install HepMC3 and LHAPDF6
        run: |
          conda activate graniitti
          source install/setenv.sh
          bash install/autoinstall.sh <<< y

      - name: Compile C++ and tests
        run: |
          conda activate graniitti
          source install/setenv.sh
          cmake -S . -B build -DWITH_TEST=ON
          cmake --build build -j4

      - name: Generate events and plot
        run: |
          conda activate graniitti
          source install/setenv.sh
          ./bin/gr -i gencard/test.json -h 0 -w true -l false -n 1500
          python -m core.iceplot --hepmc3 output/test.hepmc3

      - name: C++ tests and clang-tidy
        run: |
          conda activate graniitti
          source install/setenv.sh
          ctest --test-dir build --output-on-failure
      
      - name: Fast Python tests
        run: |
          conda activate graniitti
          source install/setenv.sh
          pytest -q -s -rP tests/technical tests/physics/unit -m "not integration and not physics"
