  tune-elastic-gpom:
    description: Tune the elastic + central GP model.
    driver: graniitti
    tunesetup: tunecards/graniitti/tune-elastic-gpom.json

  tune-pandora-v0:
    description: Tune PANDORA particle flow reconstruction model.
    driver: pandora
    tunesetup: tunecards/pandora/tune-pandora-v0.json
    fit:
      cost: pflow
      full_output: 0
    ray:
      cpu_per_trial: 2
      max_t: 28800
      worker_cpu: 8
      request_memory: 12GB
      init_cpu: 1
      workers: 300
    runtime:
      pfa_dir: ../PandoraPFA
      key4hep_setup: /cvmfs/sw-nightlies.hsf.org/key4hep/setup.sh
      key4hep_release: '2026-09-20'
    optimizer:
      num_trials: 3500
      rand_trials: 1000
      rngseed: 1835
