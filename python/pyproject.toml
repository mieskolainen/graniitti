[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
dynamic = ["version"]
description = "Simulation tuning, inference and HEP data analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Mikael Mieskolainen"}]
dependencies = ["numpy>=1.26", "scipy>=1.12", "numba>=0.59", "pyjson5", "jsonpointer", "PyYAML", "termcolor", "tqdm", "tabulate", "threadpoolctl"]

[project.optional-dependencies]
analysis = ["matplotlib", "scikit-learn", "pandas"]
ray = ["ray[tune]", "psutil"]
ampfit = ["torch"]
icebo = ["torch", "gpytorch", "pymoo"]
search = ["optuna", "hyperopt", "bayesian-optimization", "ax-platform", "scikit-optimize"]
pandora = ["uproot", "awkward"]
lbfgs = ["torch"]
inference = ["torch", "matplotlib", "scikit-learn"]
web = ["pdf2image"]
dev = ["build", "pytest", "ruff"]

[project.scripts]
icetune = "core.icetune:main"
iceplot = "core.iceplot:main"
iceproxy = "core.iceproxy:main"
icescape = "core.icescape:main"
iceviz = "core.iceviz:main"
iceweb = "core.iceweb:main"
icebo-benchmark = "core.tune.optimizers.icebo.cli:main"

[project.entry-points."core.tune.drivers"]
graniitti = "core.tune.drivers.graniitti.driver:GraniittiDriver"
pandora = "core.tune.drivers.pandora.driver:PandoraDriver"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*._old", "*._old.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yml", "*.sh", "templates/*.html"]

[tool.setuptools.dynamic]
version = {attr = "core.__version__"}
