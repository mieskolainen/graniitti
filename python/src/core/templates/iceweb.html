<!doctype html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(__ICEWEB_IMAGE_SIZE__px, 1fr));
            gap: 20px;
            padding: 20px;
            justify-items: left;
        }
        .grid-item { text-align: center; margin-bottom: 20px; }
        .grid-item img { width: __ICEWEB_IMAGE_SIZE__px; height: auto; }
        .title { font-weight: bold; margin-bottom: 5px; }
        .timestamp { font-size: 12px; color: lightgrey; margin-top: 5px; }
        h2 {
            font-size: 24px;
            color: #004080;
            margin: 40px 0 20px;
            border-bottom: 2px solid #004080;
            padding-bottom: 10px;
            clear: both;
        }
        h3 { font-size: 20px; color: #0066cc; margin: 20px 0 10px; clear: both; }
        h4 { font-size: 18px; color: #0080ff; margin: 10px 0; clear: both; }
        hr { border: 0; border-top: 1px solid #ccc; margin: 40px 0; }
    </style>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <p><strong>Page generated with <i>iceweb</i> on:</strong> __ICEWEB_GENERATED_AT__</p>
    __ICEWEB_CONTENT__
</body>
</html>
